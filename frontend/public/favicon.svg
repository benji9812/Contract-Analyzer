<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dothalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4455" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4455" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="docgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="redgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3a4a"/>
      <stop offset="100%" stop-color="#a00010"/>
    </linearGradient>
    <filter id="redglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" fill="#0b0b0b" rx="16"/>

  <ellipse cx="50" cy="52" rx="30" ry="28" fill="url(#halo)"/>

  <path d="M28,22 L66,22 L78,34 L78,78 Q78,82 74,82 L28,82 Q24,82 24,78 L24,26 Q24,22 28,22 Z"
    fill="url(#docgrad)" stroke="#333" stroke-width="0.8"/>
  <path d="M66,22 L78,34 L66,34 Z" fill="#111" stroke="#333" stroke-width="0.6"/>
  <line x1="66" y1="22" x2="78" y2="34" stroke="#444" stroke-width="0.8"/>

  <line x1="32" y1="45" x2="62" y2="45" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="53" x2="70" y2="53" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="61" x2="58" y2="61" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="18" y="49" width="56" height="4" rx="2" fill="#e63946" opacity="0.1"/>
  <line x1="18" y1="51" x2="80" y2="51" stroke="#e63946" stroke-width="0.8" opacity="0.8" filter="url(#redglow)"/>

  <ellipse cx="79" cy="51" rx="7" ry="7" fill="url(#dothalo)" opacity="0.5"/>
  <circle cx="79" cy="51" r="3" fill="url(#redgrad)" filter="url(#redglow)"/>
  <circle cx="79" cy="51" r="1.2" fill="white" opacity="0.9"/>

  <line x1="72" y1="12" x2="72" y2="24" stroke="#e63946" stroke-width="1.2" stroke-linecap="round" filter="url(#redglow)"/>
  <polygon points="72,12 82,16 72,20" fill="url(#redgrad)" filter="url(#redglow)"/>
</svg>
